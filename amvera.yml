# Конфигурация для хостинга Amvera (https://amvera.ru)
# Если вы задаёте настройки проекта в форме интерфейса Amvera, этот файл
# можно не использовать — он просто повторяет те же настройки.
meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"

build:
  requirementsPath: requirements.txt

run:
  scriptName: bot.py
  persistenceMount: /data   # постоянное хранилище: туда же пишите DATA_DIR=/data в переменных
  containerPort: 80
